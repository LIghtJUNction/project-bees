name: Project Bees Btrfs tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  btrfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Install build and filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libsqlite3-dev btrfs-progs
      - name: Build
        run: make -j2 project-bees
      - name: Create an isolated Btrfs filesystem
        run: |
          truncate -s 2G "$RUNNER_TEMP/project-bees.img"
          mkfs.btrfs -f "$RUNNER_TEMP/project-bees.img"
          mkdir "$RUNNER_TEMP/project-bees-btrfs"
          sudo mount -o loop,compress=no,noatime "$RUNNER_TEMP/project-bees.img" "$RUNNER_TEMP/project-bees-btrfs"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/project-bees-btrfs"
      - name: Verify physical sharing and preserved content
        run: PROJECT_BEES_TEST_DIR="$RUNNER_TEMP/project-bees-btrfs" make test-project-bees
      - name: Build the comparison version
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline="${BASELINE_REF:-HEAD^}"
          git show "$baseline:src/project-bees.cc" > "$RUNNER_TEMP/project-bees-before.cc"
          g++ -Wall -Wextra -Werror -O3 -std=c++17 -Iinclude -D_FILE_OFFSET_BITS=64 \
            -Wold-style-cast -Wno-missing-field-initializers \
            "$RUNNER_TEMP/project-bees-before.cc" lib/libcrucible.a \
            -lpthread -latomic -lsqlite3 -o "$RUNNER_TEMP/project-bees-before"
      - name: Compare complete deduplication passes
        run: |
          python3 test/project-bees-benchmark.py \
            --before "$RUNNER_TEMP/project-bees-before" --after bin/project-bees \
            --directory "$RUNNER_TEMP/project-bees-btrfs" --repeats 3 \
            | tee "$RUNNER_TEMP/project-bees-benchmark.jsonl"
          {
            echo '### Btrfs benchmark results'
            echo '```json'
            cat "$RUNNER_TEMP/project-bees-benchmark.jsonl"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Unmount the test filesystem
        if: always()
        run: |
          if mountpoint -q "$RUNNER_TEMP/project-bees-btrfs"; then
            sudo umount "$RUNNER_TEMP/project-bees-btrfs"
          fi
